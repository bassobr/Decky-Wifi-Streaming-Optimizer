name: Build & Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Least privilege: the default token is read-only everywhere; only the
# release job below elevates to contents: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave a (potentially write-capable) token behind in
          # .git/config where build/postinstall scripts could read it.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag whose version differs from package.json would make the in-app
      # updater offer the same "update" forever (it compares the installed
      # package.json version against the release tag).
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $V" >&2
            exit 1
          fi

      - name: Build frontend
        run: pnpm run build

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Syntax-check backend
        run: |
          python3 -m py_compile main.py
          bash -n defaults/dispatcher.sh.tmpl
          bash -n install.sh

      - name: Run backend tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Package plugin zip
        run: |
          PLUGIN="WiFi Optimizer Streaming"
          mkdir -p "pack/$PLUGIN/dist" "pack/$PLUGIN/defaults" "pack/$PLUGIN/py_modules"
          cp plugin.json package.json main.py decky.pyi LICENSE README.md "pack/$PLUGIN/"
          cp dist/index.js "pack/$PLUGIN/dist/"
          cp dist/index.js.map "pack/$PLUGIN/dist/" 2>/dev/null || true
          cp defaults/dispatcher.sh.tmpl "pack/$PLUGIN/defaults/"
          touch "pack/$PLUGIN/py_modules/.keep"
          VERSION=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          cd pack && zip -r "../wifi-optimizer-streaming-$VERSION.zip" "$PLUGIN"
          cd ..
          sha256sum wifi-optimizer-streaming-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: |
            wifi-optimizer-streaming-*.zip
            SHA256SUMS

  # install.sh and the stable-channel self-updater install the zip attached
  # here and verify it against SHA256SUMS. The committed dist/ only serves
  # the beta channel (branch tarball) and install.sh's no-release fallback.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" wifi-optimizer-streaming-*.zip SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
