name: Build & Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Least privilege: the default token is read-only everywhere; only the
# release job below elevates to contents: write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Don't leave a (potentially write-capable) token behind in
          # .git/config where build/postinstall scripts could read it.
          persist-credentials: false

      # Version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag whose version differs from package.json would make the in-app
      # updater offer the same "update" forever (it compares the installed
      # package.json version against the release tag).
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $V" >&2
            exit 1
          fi

      - name: Build frontend
        run: pnpm run build

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Syntax-check backend
        run: |
          python3 -m compileall -q main.py py_modules/wifioptimizer
          bash -n defaults/dispatcher.sh.tmpl
          bash -n install.sh

      - name: Run backend tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Package plugin zip
        run: |
          PLUGIN="WiFi Optimizer Streaming"
          mkdir -p "pack/$PLUGIN/dist" "pack/$PLUGIN/defaults"
          cp plugin.json package.json main.py decky.pyi LICENSE README.md "pack/$PLUGIN/"
          cp dist/index.js "pack/$PLUGIN/dist/"
          cp dist/index.js.map "pack/$PLUGIN/dist/" 2>/dev/null || true
          cp defaults/dispatcher.sh.tmpl "pack/$PLUGIN/defaults/"
          # The backend package ships with the plugin; strip caches from the
          # compileall step above.
          cp -r py_modules "pack/$PLUGIN/"
          find "pack/$PLUGIN/py_modules" -name "__pycache__" -type d -prune -exec rm -rf {} +
          VERSION=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          cd pack && zip -r "../wifi-optimizer-streaming-$VERSION.zip" "$PLUGIN"
          cd ..
          sha256sum wifi-optimizer-streaming-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-zip
          path: |
            wifi-optimizer-streaming-*.zip
            SHA256SUMS

  # install.sh and the stable-channel self-updater install the zip attached
  # here and verify it against SHA256SUMS. The committed dist/ only serves
  # the beta channel (branch tarball) and install.sh's no-release fallback.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout provides minisign.pub and the signing/verify code; artifacts
      # are downloaded next to it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-zip

      # SEC-03 (Variant A): sign SHA256SUMS with the release key held as a
      # repo secret, then verify the fresh signature against the committed
      # public key. The verify step makes a seed/pubkey mismatch (e.g. a
      # rotated secret without a pubkey update) fail the release instead of
      # shipping a signature no client would ever accept. The updater pins
      # minisign.pub and refuses unsigned stable releases.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SEED: ${{ secrets.MINISIGN_SEED }}
        run: |
          PYTHONPATH=py_modules python3 -m wifioptimizer.minisign \
            sign SHA256SUMS minisign.pub \
            --trusted-comment "wifi-optimizer-streaming ${GITHUB_REF_NAME}"
          PYTHONPATH=py_modules python3 -m wifioptimizer.minisign \
            verify SHA256SUMS SHA256SUMS.minisig minisign.pub

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            wifi-optimizer-streaming-*.zip SHA256SUMS SHA256SUMS.minisig \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
